<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terms & Conditions</title>
    <link rel="stylesheet" href="styles.css?v=20260303a" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
    <div class="container" style="padding: 24px 16px; max-width: 900px; margin: 0 auto;">
        <a href="./" style="display: inline-block; margin-bottom: 12px;">← Back to menu</a>
        <h1 id="legal-title">Terms & Conditions</h1>
        <div id="legal-content" data-page="terms"></div>
    </div>

    <div id="site-map" class="site-map" style="display:none;"></div>
    <footer id="site-footer" class="site-footer"></footer>

    <script src="legal.js?v=20260127a"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // optional footer render: reuse same public settings API
        (async function () {
            try {
                const res = await fetch('api/settings/site');
                if (!res.ok) return;
                const s = await res.json();

                let wh = null;
                try {
                    const whRes = await fetch('api/settings/working-hours');
                    if (whRes.ok) wh = await whRes.json();
                } catch (e) {}

                const getWeekdayKeyInTimeZone = (timeZone, date = new Date()) => {
                    const tz = (timeZone || 'Europe/Sofia').toString();
                    try {
                        const weekdayShort = new Intl.DateTimeFormat('en-US', { timeZone: tz, weekday: 'short' }).format(date);
                        const map = { Mon: 'mon', Tue: 'tue', Wed: 'wed', Thu: 'thu', Fri: 'fri', Sat: 'sat', Sun: 'sun' };
                        return map[weekdayShort] || null;
                    } catch (e) {
                        return null;
                    }
                };

                const normalizeWorkingHours = (raw) => {
                    const timeZone = (raw?.timezone || raw?.timeZone || 'Europe/Sofia').toString().trim() || 'Europe/Sofia';
                    const legacyOpening = (raw?.openingTime || '09:00').toString().trim() || '09:00';
                    const legacyClosing = (raw?.closingTime || '22:00').toString().trim() || '22:00';
                    const legacyDay = { closed: false, openingTime: legacyOpening, closingTime: legacyClosing };
                    const weeklyIn = (raw && typeof raw.weekly === 'object' && raw.weekly) ? raw.weekly : null;
                    const keys = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
                    const weekly = {};
                    keys.forEach(k => {
                        const d = weeklyIn ? weeklyIn[k] : null;
                        weekly[k] = {
                            closed: d?.closed === true,
                            openingTime: (d?.openingTime || legacyDay.openingTime).toString().trim() || legacyDay.openingTime,
                            closingTime: (d?.closingTime || legacyDay.closingTime).toString().trim() || legacyDay.closingTime
                        };
                    });
                    return { timezone: timeZone, weekly };
                };

                const whCfg = normalizeWorkingHours(wh || null);
                const dayNames = { mon: 'Monday', tue: 'Tuesday', wed: 'Wednesday', thu: 'Thursday', fri: 'Friday', sat: 'Saturday', sun: 'Sunday' };
                const dayOrder = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
                const whWeeklyHtml = dayOrder
                    .map(k => {
                        const d = (whCfg.weekly && whCfg.weekly[k]) ? whCfg.weekly[k] : { closed: false, openingTime: '09:00', closingTime: '22:00' };
                        const open = (d.openingTime || '').toString().trim();
                        const close = (d.closingTime || '').toString().trim();
                        const rangeText = d.closed === true ? 'Closed' : `${open} - ${close}`;
                        return `<div>${esc(dayNames[k] || k)}: ${esc(rangeText)}</div>`;
                    })
                    .join('');

                // map (above footer)
                try {
                    const mapEl = document.getElementById('site-map');
                    const mapCfg = s?.map || {};
                    const enabled = !!mapCfg.enabled;
                    const lat = typeof mapCfg.lat === 'number' ? mapCfg.lat : parseFloat(mapCfg.lat);
                    const lng = typeof mapCfg.lng === 'number' ? mapCfg.lng : parseFloat(mapCfg.lng);
                    const zoom = Number.isFinite(Number(mapCfg.zoom)) ? Math.max(1, Math.min(19, Math.round(Number(mapCfg.zoom)))) : 16;
                    const label = (mapCfg.label || s?.footer?.contacts?.address || '').toString().trim();

                    if (mapEl && enabled && Number.isFinite(lat) && Number.isFinite(lng) && window.L) {
                        mapEl.style.display = 'block';
                        mapEl.innerHTML = '<div id="site-map-leaflet" style="width:100%;height:100%;"></div>';
                        const map = window.L.map('site-map-leaflet', { scrollWheelZoom: false });
                        map.setView([lat, lng], zoom);
                        window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                            maxZoom: 19,
                            attribution: '&copy; OpenStreetMap'
                        }).addTo(map);
                        const marker = window.L.marker([lat, lng]).addTo(map);
                        if (label) {
                            marker.bindTooltip(label, { permanent: true, direction: 'top', offset: [0, -10] });
                            marker.bindPopup(label);
                        }
                    }
                } catch (e) {}

                const footerEl = document.getElementById('site-footer');
                if (!footerEl) return;
                const contacts = (s && s.footer && s.footer.contacts) ? s.footer.contacts : {};
                const aboutText = ((s && s.footer && s.footer.aboutText) || '').toString().trim();
                const socials = Array.isArray(s && s.footer && s.footer.socials) ? s.footer.socials : [];

                const esc = (v) => (v ?? '').toString()
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');

                const rawAddress = (contacts.address || '').toString().trim();
                const explicitMapsUrlRaw = (contacts.addressMapsUrl || '').toString().trim();
                const explicitMapsUrl = explicitMapsUrlRaw && !/^https?:\/\//i.test(explicitMapsUrlRaw) && /^www\./i.test(explicitMapsUrlRaw)
                    ? `https://${explicitMapsUrlRaw}`
                    : explicitMapsUrlRaw;
                const mapCfg = s?.map || {};
                const lat = typeof mapCfg.lat === 'number' ? mapCfg.lat : parseFloat(mapCfg.lat);
                const lng = typeof mapCfg.lng === 'number' ? mapCfg.lng : parseFloat(mapCfg.lng);
                const derivedMapsUrl = Number.isFinite(lat) && Number.isFinite(lng)
                    ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${lat},${lng}`)}`
                    : (rawAddress ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(rawAddress)}` : '');
                const addressMapsUrl = explicitMapsUrl || derivedMapsUrl;
                const addressHtml = rawAddress
                    ? (addressMapsUrl
                        ? `<a href="${esc(addressMapsUrl)}" target="_blank" rel="noopener noreferrer">${esc(rawAddress)}</a>`
                        : esc(rawAddress))
                    : '';

                const contactLines = [
                    rawAddress ? `<li><strong>Address:</strong> ${addressHtml}</li>` : '',
                    contacts.phone ? `<li><strong>Phone:</strong> <a class="footer-contact-link" href="tel:${encodeURIComponent(String(contacts.phone))}">${esc(contacts.phone)}</a></li>` : '',
                    contacts.email ? `<li><strong>Email:</strong> <a href="mailto:${encodeURIComponent(contacts.email)}">${esc(contacts.email)}</a></li>` : ''
                ].filter(Boolean).join('');

                const detectKey = (x) => {
                    const url = (x?.url || '').toString().toLowerCase();
                    const label = (x?.label || '').toString().toLowerCase();
                    if (url.includes('facebook') || label.includes('facebook')) return 'facebook';
                    if (url.includes('instagram') || label.includes('instagram')) return 'instagram';
                    if (url.includes('google') || url.includes('maps') || label.includes('google')) return 'google';
                    return '';
                };

                const iconFor = (k) => {
                    if (k === 'facebook') return 'fab fa-facebook-f';
                    if (k === 'instagram') return 'fab fa-instagram';
                    if (k === 'google') return 'fab fa-google';
                    return 'fas fa-link';
                };

                const byKey = new Map();
                socials.forEach(x => {
                    if (!x || !x.url) return;
                    const k = detectKey(x);
                    if (!k) return;
                    if (!byKey.has(k)) byKey.set(k, x);
                });

                const socialLinks = ['facebook', 'instagram', 'google']
                    .map(k => {
                        const x = byKey.get(k);
                        if (!x || !x.url) return '';
                        return `<a class="footer-social-icon" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(k)}"><i class="${esc(iconFor(k))}"></i></a>`;
                    })
                    .filter(Boolean)
                    .join('');

                footerEl.innerHTML = `
                    <div class="footer-inner">
                        <div class="footer-grid">
                            <div class="footer-col">
                                <h3>Contacts</h3>
                                <ul>${contactLines || '<li>—</li>'}</ul>
                            </div>
                            <div class="footer-col">
                                <h3>Working hours</h3>
                                <div>${whWeeklyHtml || '—'}</div>
                            </div>
                            <div class="footer-col">
                                <h3>Information</h3>
                                <ul>
                                    <li><a href="terms">Terms</a></li>
                                    <li><a href="privacy">Privacy policy</a></li>
                                </ul>
                            </div>
                            <div class="footer-col">
                                <h3>About us</h3>
                                <p>${aboutText ? esc(aboutText) : '—'}</p>
                                ${socialLinks ? `<div class="footer-socials">${socialLinks}</div>` : ''}
                            </div>
                        </div>
                        <div class="footer-bottom">
                            <div>Powered by: Crystal Automation &amp; Karakashkov</div>
                            <div>&copy; ${new Date().getFullYear()}</div>
                        </div>
                    </div>
                `;
            } catch (e) {}
        })();
    </script>
</body>
</html>
